services:
  serial-bridge:
    image: ghcr.io/yeraze/meshtastic-serial-bridge:latest
    container_name: meshtastic-serial-bridge
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0  # Change to your device
    ports:
      - "4403:4403"
    restart: unless-stopped
    environment:
      - SERIAL_DEVICE=/dev/ttyUSB0
      - BAUD_RATE=115200
      - TCP_PORT=4403

  meshmonitor:
    image: ghcr.io/yeraze/meshmonitor:latest
    container_name: meshmonitor
    ports:
      - "9090:3001"
    volumes:
      - meshmonitor-data:/data
    environment:
      - MESHTASTIC_NODE_IP=serial-bridge
      - DEFAULT_WEATHER_LOCATION=Farmington, MI
      - ALLOWED_ORIGINS=http://192.168.50.18:9090,http://lucinda:9090
      - PIRATE_WEATHER_API_KEY=${PIRATE_WEATHER_API_KEY}
    restart: unless-stopped
    depends_on:
      - serial-bridge

volumes:
  meshmonitor-data: